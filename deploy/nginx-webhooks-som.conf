# =============================================================================
# Segunda Opinión Médica · webhooks públicos en el nginx del API (api.medplum.com.ar)
#
# El API es un Medplum (proceso Node con pm2) detrás de nginx, en 127.0.0.1:8103, y lo
# comparten otros proyectos. Estos bloques van DENTRO del `server { listen 443 …;
# server_name api.medplum.com.ar; }` que ya existe, ANTES de su `location /`. Por ejemplo:
#   sudo cp deploy/nginx-webhooks-som.conf /etc/nginx/snippets/som-webhooks.conf
#   (completar los placeholders EN EL SERVIDOR) y, dentro de ese server:
#   include /etc/nginx/snippets/som-webhooks.conf;
#
# Receta: URL pública limpia hacia afuera (ni Twilio ni MercadoPago ven una clave; MP
# además rechaza URLs con "usuario:clave@"). nginx agrega el Authorization Basic de la
# ClientApplication dedicada de cada webhook y reenvía al $execute del bot. Cada
# ClientApplication solo puede ejecutar su bot (AccessPolicy "Webhook Twilio — WhatsApp
# entrante" / "Webhook MercadoPago — pagos"): si una clave se filtrara, no da datos.
# Las rutas llevan el prefijo /webhooks/som/ para no chocar con las de otros proyectos.
#
# `$execute`: nginx no admite un "$" literal en proxy_pass. Se usa `$simbolo_pesos`, que
# el nginx del API ya declara a nivel http (fuera de todo server):
#   geo $simbolo_pesos { default "$"; }
# Si existe, NO repetirla (nginx -t falla por variable duplicada); si no, declararla una vez.
#
# Placeholders (los ids y clientIds los imprime `npm run webhooks`):
#   BOT_ID_SOM_WHATSAPP_ENTRANTE → id del bot som-whatsapp-entrante
#   BOT_ID_SOM_WEBHOOK_MP        → id del bot som-webhook-mercadopago
#   BASIC_SOM_WEBHOOK_TWILIO     → printf '%s' '<clientId>:<clientSecret>' | base64 -w0
#                                  de la ClientApplication "Webhook Twilio"
#   BASIC_SOM_WEBHOOK_MP         → ídem, de la ClientApplication "Webhook MercadoPago"
# clientId y secret: Medplum → Project Admin → Clients → la ClientApplication. Las claves
# se completan solo en el servidor: nunca se commitean.
#
# Después: sudo nginx -t && sudo systemctl reload nginx
# y desde el repo: npm run webhooks  (prueba las dos URLs de punta a punta).
#
# Si se recrea un bot, cambia su id: actualizarlo acá y recargar nginx.
# =============================================================================

# ------------------------------------------------------------------
# WhatsApp (Twilio) — mensajes entrantes y estados de entrega (✓✓).
# Va en Twilio (WhatsApp sender → "Webhook URL for incoming messages", POST) y en el
# Project Secret TWILIO_WEBHOOK_URL:
#   https://api.medplum.com.ar/webhooks/som/twilio-whatsapp
# El bot valida la firma X-Twilio-Signature contra esa URL: nginx reenvía el encabezado
# tal cual (no tocarlo) y hace falta Medplum ≥ 4.2 (le pasa los encabezados al bot).
# ------------------------------------------------------------------
location = /webhooks/som/twilio-whatsapp {
    proxy_pass http://127.0.0.1:8103/fhir/R4/Bot/BOT_ID_SOM_WHATSAPP_ENTRANTE/${simbolo_pesos}execute$is_args$args;
    proxy_http_version 1.1;

    proxy_set_header Authorization     "Basic BASIC_SOM_WEBHOOK_TWILIO";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 30s;
}

# ------------------------------------------------------------------
# MercadoPago — pagos (confirma el turno al acreditarse la seña).
# Va en el panel de MP (Tus integraciones → la aplicación → Webhooks, modo productivo,
# evento "Pagos"; Webhooks, no IPN) y en el Project Secret MP_WEBHOOK_URL:
#   https://api.medplum.com.ar/webhooks/som/mercadopago
# El bot no confía en el payload: consulta el pago a la API de MercadoPago.
# ------------------------------------------------------------------
location = /webhooks/som/mercadopago {
    proxy_pass http://127.0.0.1:8103/fhir/R4/Bot/BOT_ID_SOM_WEBHOOK_MP/${simbolo_pesos}execute$is_args$args;
    proxy_http_version 1.1;

    proxy_set_header Authorization     "Basic BASIC_SOM_WEBHOOK_MP";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 30s;
}
